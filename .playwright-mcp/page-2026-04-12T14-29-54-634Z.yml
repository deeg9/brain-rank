        - heading "Resources" [level=1] [ref=e24]
        - paragraph [ref=e25]: Understanding your neural activation scores, what they mean, and how to use them to improve your content.
      - generic [ref=e26]:
        - heading "How NeuroCut Works" [level=2] [ref=e27]
        - paragraph [ref=e28]:
          - text: NeuroCut uses
          - strong [ref=e29]: TRIBE v2
          - text: ", a brain-predictive foundation model developed by Meta AI Research. TRIBE v2 was trained on thousands of hours of fMRI brain scan data — recordings of real human brain activity while people watched videos."
        - paragraph [ref=e30]: "When you upload a video, TRIBE v2 processes the visual, audio, and text content through three specialized neural encoders:"
        - generic [ref=e31]:
          - generic [ref=e32]:
            - paragraph [ref=e33]: V-JEPA2
            - paragraph [ref=e34]: Processes visual features — motion, composition, faces, objects, scene changes
          - generic [ref=e35]:
            - paragraph [ref=e36]: Wav2Vec-BERT
            - paragraph [ref=e37]: Processes audio features — music, speech, sound effects, silence, rhythm
          - generic [ref=e38]:
            - paragraph [ref=e39]: LLaMA 3.2
            - paragraph [ref=e40]: Processes text/narrative — transcribed speech, storytelling, dialogue meaning
        - paragraph [ref=e41]:
          - text: These encoders feed into a prediction head that outputs
          - strong [ref=e42]: per-vertex cortical activation
          - text: across 20,484 points on the brain surface, every 2 seconds. NeuroCut then maps these activations to functional brain networks you can understand.
      - generic [ref=e43]:
        - heading "Understanding Your Scores" [level=2] [ref=e44]
        - paragraph [ref=e45]:
          - text: NeuroCut scores are
          - strong [ref=e46]: not percentages
          - text: . They represent normalized neural activation intensity on a scale from 0.00 to 1.00. This is a measure of how strongly the predicted brain response fires — not a grade.
        - generic [ref=e47]:
          - paragraph [ref=e48]: "Important: 0.50 is a strong score, not \"average\""
          - paragraph [ref=e49]: Your brain is always active — baseline resting activity sits around 0.15-0.25. A score of 0.50 means the content is driving activation well above baseline. You do NOT want 1.00 — that level of neural activation would be closer to an epileptic seizure than engaged viewing.
