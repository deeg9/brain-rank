        - heading "About the Science" [level=2] [ref=e175]
        - paragraph [ref=e176]: TRIBE v2 (Temporally Resolved Inter-subject Brain Encoding) is a foundation model for predicting brain activity from multimedia content. It was developed by Meta AI Research and published in 2025.
        - generic [ref=e177]:
          - paragraph [ref=e178]: "Key research references:"
          - list [ref=e179]:
            - listitem [ref=e180]: "TRIBE v2: Brain-Predictive Foundation Model — Meta AI Research (2025)"
            - listitem [ref=e181]: Russell Circumplex Model of Affect — James A. Russell (1980)
            - listitem [ref=e182]: Destrieux Atlas — cortical parcellation scheme mapping 20,484 vertices to functional regions
            - listitem [ref=e183]: fMRI (functional Magnetic Resonance Imaging) — the neuroimaging technique used to train the model
        - paragraph [ref=e184]: NeuroCut maps TRIBE v2's raw cortical vertex output (20,484 activation values per 2-second segment) to 9 functional brain networks using the Destrieux atlas parcellation. This transforms neuroscience data into actionable creator insights.
        - paragraph [ref=e185]: "Note: TRIBE v2 is licensed under CC BY-NC-4.0 (non-commercial use). NeuroCut's predictions are computational estimates of brain activity, not actual brain scans. Results should be interpreted as data-informed insights, not medical or scientific measurements."
