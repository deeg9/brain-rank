      - generic [ref=e159]:
        - heading "Key Metrics" [level=2] [ref=e160]
        - generic [ref=e161]:
          - generic [ref=e162]:
            - paragraph [ref=e163]: Hook Strength
            - paragraph [ref=e164]: Average neural activation (attention + reward regions) during the first 10 seconds. Measures how effectively your opening captures the viewer. Above 0.40 is strong. Critical for social media where users decide to stay or scroll within seconds.
          - generic [ref=e165]:
            - paragraph [ref=e166]: Peak Moment
            - paragraph [ref=e167]: The exact 2-second segment with the highest overall activation across all brain regions. This is your video's most neurally engaging moment. Use it as a thumbnail frame, clip highlight, or to understand what drives the strongest brain response.
          - generic [ref=e168]:
            - paragraph [ref=e169]: Arousal
            - paragraph [ref=e170]: The viewer's physiological activation level — how alert or stimulated their nervous system is. High arousal (>0.60) = exciting, intense content. Low arousal (<0.30) = calming or boring content. Best content often oscillates between high and moderate arousal.
          - generic [ref=e171]:
            - paragraph [ref=e172]: Valence
            - paragraph [ref=e173]: The emotional positivity or negativity of the response. High valence (>0.60) = positive emotions (joy, satisfaction). Low valence (<0.30) = negative emotions (fear, sadness). Combined with arousal on the circumplex chart, it maps the full emotional experience.
