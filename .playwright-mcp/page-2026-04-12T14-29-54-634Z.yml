          - generic [ref=e75]:
            - generic [ref=e78]:
              - paragraph [ref=e79]: Baseline (0.00 — 0.25)
              - paragraph [ref=e80]: Brain is at resting state. Content isn't registering meaningful activation. This is normal for low-energy moments like long static shots or silence. If your entire video scores here, the content may not be engaging enough.
            - generic [ref=e83]:
              - paragraph [ref=e84]: Moderate (0.25 — 0.45)
              - paragraph [ref=e85]: Content is registering — the viewer is casually engaged. This is typical for conversational content, simple tutorials, or calm footage. Most everyday content sits in this range. Solid but not remarkable.
            - generic [ref=e88]:
              - paragraph [ref=e89]: Strong (0.45 — 0.65)
              - paragraph [ref=e90]: High engagement — the viewer is locked in. This is what you should aim for. Content in this range triggers genuine attention and emotional response. Most viral content peaks in this tier. If your average score is here, your content is performing well.
            - generic [ref=e93]:
              - paragraph [ref=e94]: Exceptional (0.65 — 0.85)
              - paragraph [ref=e95]: Peak neural response — these are rare, powerful moments. Jump scares, plot twists, emotional climaxes, and breakthrough revelations score here. Individual segments may hit this tier, but sustained exceptional activation across an entire video is uncommon.
            - generic [ref=e98]:
              - paragraph [ref=e99]: Intense (0.85+)
              - paragraph [ref=e100]: Extremely rare activation — maximum neural intensity. This indicates overwhelming sensory or emotional stimulation. Sustained scores here are not realistic or desirable — think of it as the brain's "red zone." Brief spikes here indicate the single most impactful moment in your content.
