        - generic [ref=e172]:
          - heading "Key Metrics" [level=2] [ref=e173]
          - generic [ref=e174]:
            - generic [ref=e175]:
              - paragraph [ref=e176]: Engagement Score
              - paragraph [ref=e177]: Your top-line number. A weighted blend of peak moment (40%), hook strength (30%), and retention (30%). It balances "how strong is your best moment" against "how consistently engaging is the whole piece." A single value you can compare across your own uploads and against the leaderboard.
            - generic [ref=e178]:
              - paragraph [ref=e179]: Hook Strength
              - paragraph [ref=e180]: Average overall neural activation during the first 10 seconds of your content (the first five 2-second segments, averaged across all brain regions). Measures how quickly your opening captures attention. Above 0.40 is strong. Critical for short-form and social feeds where viewers decide to stay or scroll within seconds.
            - generic [ref=e181]:
              - paragraph [ref=e182]: Retention
              - paragraph [ref=e183]: The weakest 10-second window across your content. BrainRank slides a 5-segment window over the full timeline and takes the minimum — so a low retention score means there's a stretch where the brain response drops off. Use this to find the single worst section of your edit and decide whether to tighten, cut, or replace it.
            - generic [ref=e184]:
              - paragraph [ref=e185]: Peak Moment
              - paragraph [ref=e186]: The exact 2-second segment with the highest overall activation across all brain regions. This is your content's most neurally engaging moment. Use it as a thumbnail frame, clip highlight, or to understand what drives the strongest brain response.
            - generic [ref=e187]:
              - paragraph [ref=e188]: Arousal
              - paragraph [ref=e189]: The viewer's physiological activation level — how alert or stimulated their nervous system is. Computed from attention and emotional-processing networks. High arousal (>0.60) = exciting, intense content. Low arousal (<0.30) = calming or boring content. Best content often oscillates between high and moderate arousal rather than pinning at either extreme.
            - generic [ref=e190]:
              - paragraph [ref=e191]: Valence
              - paragraph [ref=e192]: Combines the reward and social-cognition networks. High valence (>0.60) = content triggers satisfaction and social-emotional approach (joy, connection, warmth). Low valence (<0.30) = disengagement, avoidance, or negative affect. Plotted with arousal on the circumplex chart, it maps the full emotional experience of your viewer.
        - generic [ref=e193]:
          - heading "About the Science" [level=2] [ref=e194]
          - paragraph [ref=e195]: TRIBE v2 (Temporally Resolved Inter-subject Brain Encoding) is a foundation model for predicting brain activity from multimedia content. It was developed by Meta AI Research and published in 2025. The model was trained on multi-hour fMRI recordings of people watching naturalistic video, which is why it generalizes across genres and formats rather than being locked to a single content type.
          - generic [ref=e196]:
            - heading "Temporal resolution" [level=3] [ref=e197]
            - paragraph [ref=e198]: TRIBE v2 predicts brain state in 2-second windows. That's the same temporal resolution the model was trained on (the repetition time, or TR, of the underlying fMRI scans), and it's why every segment-level metric you see in BrainRank lands on an even-second boundary. Shorter-than-2s events — a single frame, a one-word utterance — contribute to the segment they fall in but can't be isolated below that window.
          - generic [ref=e199]:
            - heading "Cortical parcellation" [level=3] [ref=e200]
            - paragraph [ref=e201]: BrainRank takes TRIBE v2's 20,484 per-vertex activation values and collapses them into 9 functional networks using the Destrieux atlas, which divides the cortical surface into roughly 150 anatomically defined regions. Each network in BrainRank is a weighted aggregation of the regions most associated with that function in the neuroscience literature — for example, the Attention network combines dorsal and ventral attention regions (intraparietal sulcus, frontal eye fields, superior parietal lobule) rather than trusting a single anatomical area in isolation.
          - generic [ref=e202]:
            - heading "Normalization" [level=3] [ref=e203]
            - paragraph [ref=e204]: Raw activation values don't come with a fixed scale, so every score you see on BrainRank is normalized using robust percentile scaling (clipped at the 1st and 99th percentiles of the model's training distribution, then rescaled to 0–1). A 0.50 means the response lands firmly above the population baseline — not that it's "half of maximum." This is also why tier boundaries (baseline, moderate, strong, exceptional, intense) are what they are.
          - generic [ref=e205]:
            - heading "How multi-modal content is handled" [level=3] [ref=e206]
            - paragraph [ref=e207]: TRIBE v2 is built to receive vision, audio, and text features simultaneously. When you upload an image, BrainRank holds it as a static frame for the duration you set and pipes silence into the audio encoder, so the prediction isolates the visual contribution. When you upload a text script in spoken mode, the script is synthesized into speech so the audio and language encoders both activate on the same narrative — the way a viewer would actually hear it. Visual-text mode renders the text on-screen so the visual encoder sees the typography exactly as your audience would. The more modalities you supply, the closer the prediction is to the full viewing experience.
          - generic [ref=e208]:
            - heading "What BrainRank is — and isn't" [level=3] [ref=e209]
            - paragraph [ref=e210]:
              - text: These predictions are not scans of any individual viewer's brain, and they are not measurements of your own brain either. TRIBE v2 infers the group-average cortical response that
              - emphasis [ref=e211]: would
              - text: occur if a representative pool of viewers watched your content under naturalistic conditions. Treat the numbers as a directional signal for how content tends to land — strong hook, weak middle, peak at 00:42 — not as a diagnostic about a specific person.
          - generic [ref=e212]:
            - paragraph [ref=e213]: "Key research references:"
            - list [ref=e214]:
              - listitem [ref=e215]:
                - strong [ref=e216]: "TRIBE v2: Brain-Predictive Foundation Model"
                - text: — Meta AI Research (2025). The foundation model that powers every BrainRank prediction.
              - listitem [ref=e217]:
                - strong [ref=e218]: Russell Circumplex Model of Affect
                - text: — James A. Russell (1980). The two-axis emotion model (arousal × valence) we plot on the emotional-state chart.
              - listitem [ref=e219]:
                - strong [ref=e220]: Destrieux Atlas
                - text: — cortical parcellation scheme mapping the 20,484 surface vertices to ~150 functional regions. Used to aggregate vertex-level outputs into our 9 brain networks.
              - listitem [ref=e221]:
                - strong [ref=e222]: fMRI (functional Magnetic Resonance Imaging)
                - text: — the neuroimaging modality used to collect TRIBE v2's training data. Measures blood-oxygenation changes as a proxy for neural activity.
              - listitem [ref=e223]:
                - strong [ref=e224]: Naturalistic neuroimaging datasets
                - text: — multi-hour recordings of real people watching unedited video, the ground truth TRIBE v2 was fit to.
          - paragraph [ref=e225]: "Note: TRIBE v2 is licensed under CC BY-NC-4.0 (non-commercial use). BrainRank's predictions are computational estimates of brain activity, not actual brain scans. Results should be interpreted as data-informed insights, not medical or scientific measurements."
