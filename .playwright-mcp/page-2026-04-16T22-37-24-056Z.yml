            - heading "What each tier means for creators" [level=3] [ref=e87]
            - generic [ref=e88]:
              - generic [ref=e91]:
                - paragraph [ref=e92]: Baseline (0.00 — 0.25)
                - paragraph [ref=e93]: Brain is at resting state. Content isn't registering meaningful activation. This is normal for low-energy moments like long static shots or silence. If your entire video scores here, the content may not be engaging enough.
              - generic [ref=e96]:
                - paragraph [ref=e97]: Moderate (0.25 — 0.45)
                - paragraph [ref=e98]: Content is registering — the viewer is casually engaged. This is typical for conversational content, simple tutorials, or calm footage. Most everyday content sits in this range. Solid but not remarkable.
              - generic [ref=e101]:
                - paragraph [ref=e102]: Strong (0.45 — 0.65)
                - paragraph [ref=e103]: High engagement — the viewer is locked in. This is what you should aim for. Content in this range triggers genuine attention and emotional response. Most viral content peaks in this tier. If your average score is here, your content is performing well.
              - generic [ref=e106]:
                - paragraph [ref=e107]: Exceptional (0.65 — 0.85)
                - paragraph [ref=e108]: Peak neural response — these are rare, powerful moments. Jump scares, plot twists, emotional climaxes, and breakthrough revelations score here. Individual segments may hit this tier, but sustained exceptional activation across an entire video is uncommon.
              - generic [ref=e111]:
                - paragraph [ref=e112]: Intense (0.85+)
                - paragraph [ref=e113]: Extremely rare activation — maximum neural intensity. This indicates overwhelming sensory or emotional stimulation. Sustained scores here are not realistic or desirable — think of it as the brain's "red zone." Brief spikes here indicate the single most impactful moment in your content.
        - generic [ref=e114]:
          - heading "Brain Regions Explained" [level=2] [ref=e115]
          - paragraph [ref=e116]: BrainRank tracks 9 functional brain networks. Each represents a different aspect of how viewers process your content. Understanding which networks activate helps you optimize for specific types of engagement.
