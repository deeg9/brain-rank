          - heading "Resources" [level=1] [ref=e11]
          - paragraph [ref=e12]: Understanding your neural activation scores, what they mean, and how to use them to improve your content.
        - generic [ref=e13]:
          - heading "How BrainRank Works" [level=2] [ref=e14]
          - paragraph [ref=e15]:
            - text: BrainRank uses
            - strong [ref=e16]: TRIBE v2
            - text: ", a brain-predictive foundation model developed by Meta AI Research. TRIBE v2 was trained on thousands of hours of fMRI brain scan data — recordings of real human brain activity while people watched videos."
          - paragraph [ref=e17]:
            - text: BrainRank accepts three kinds of input —
            - strong [ref=e18]: video
            - text: ","
            - strong [ref=e19]: image
            - text: ", and"
            - strong [ref=e20]: text
            - text: "— and routes each through three specialized neural encoders to predict per-segment cortical activation:"
          - generic [ref=e21]:
            - generic [ref=e22]:
              - paragraph [ref=e23]: V-JEPA2
              - paragraph [ref=e24]: Processes visual features — motion, composition, faces, objects, scene changes
            - generic [ref=e25]:
              - paragraph [ref=e26]: Wav2Vec-BERT
              - paragraph [ref=e27]: Processes audio features — music, speech, sound effects, silence, rhythm
            - generic [ref=e28]:
              - paragraph [ref=e29]: LLaMA 3.2
              - paragraph [ref=e30]: Processes text and narrative — transcribed speech, storytelling, dialogue meaning
          - generic [ref=e31]:
            - paragraph [ref=e32]: "Which encoders light up depends on the modality you upload:"
            - generic [ref=e33]:
              - generic [ref=e36]:
                - paragraph [ref=e37]: Video
                - paragraph [ref=e38]: All three encoders engage — visual frames through V-JEPA2, the audio track through Wav2Vec-BERT, and transcribed speech through LLaMA 3.2.
              - generic [ref=e41]:
                - paragraph [ref=e42]: Image
                - paragraph [ref=e43]: Held as a static frame for the duration you set and routed through V-JEPA2, with silence fed to the audio encoder. Use this for thumbnails and stills.
              - generic [ref=e46]:
                - paragraph [ref=e47]: Text — Spoken
                - paragraph [ref=e48]: Your script is synthesized into speech and run through Wav2Vec-BERT + LLaMA 3.2; a neutral visual is used for V-JEPA2. Use this for voiceovers and scripts you intend to narrate.
              - generic [ref=e51]:
                - paragraph [ref=e52]: Text — Visual
                - paragraph [ref=e53]: The text is rendered as on-screen typography for V-JEPA2 and processed as written language by LLaMA 3.2. Use this for captions, titles, and on-screen copy.
          - paragraph [ref=e54]:
            - text: These encoders feed into a prediction head that outputs
            - strong [ref=e55]: per-vertex cortical activation
            - text: across 20,484 points on the brain surface, every 2 seconds. BrainRank then maps these activations to functional brain networks you can understand.
        - generic [ref=e56]:
          - heading "Understanding Your Scores" [level=2] [ref=e57]
          - paragraph [ref=e58]:
            - text: BrainRank scores are
            - strong [ref=e59]: not percentages
            - text: . They represent normalized neural activation intensity on a scale from 0.00 to 1.00. This is a measure of how strongly the predicted brain response fires — not a grade.
          - generic [ref=e60]:
            - paragraph [ref=e61]: "Important: 0.50 is a strong score, not \"average\""
            - paragraph [ref=e62]: Your brain is always active — baseline resting activity sits around 0.15-0.25. A score of 0.50 means the content is driving activation well above baseline. You do NOT want 1.00 — that level of neural activation would be closer to an epileptic seizure than engaged viewing.
          - generic [ref=e63]:
