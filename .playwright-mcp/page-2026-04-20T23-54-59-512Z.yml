        - heading "Privacy Policy" [level=1] [ref=e9]
        - paragraph [ref=e10]: "Effective Date: April 15, 2026"
        - paragraph [ref=e11]: "Last Updated: April 20, 2026"
        - generic [ref=e12]:
          - paragraph [ref=e13]: Research Beta Notice
          - paragraph [ref=e14]:
            - text: BrainRank is currently operating as a non-commercial research beta. We use Meta's TRIBE v2 model under the
            - link "CC BY-NC 4.0 license" [ref=e15] [cursor=pointer]:
              - /url: https://creativecommons.org/licenses/by-nc/4.0/
            - text: . No fees are collected during the beta, and uploads are additionally governed by our
            - link "Contribution Agreement" [ref=e16] [cursor=pointer]:
              - /url: /research-agreement
            - text: .
        - paragraph [ref=e17]: This Privacy Policy describes how BrainRank ("we," "us," or "our") collects, uses, discloses, and protects your personal information when you access or use our website, applications, and related services (collectively, the "Service"). By using the Service, you agree to the collection and use of information in accordance with this policy.
        - heading "1. Information We Collect" [level=2] [ref=e18]
        - heading "1.1 Account Information" [level=3] [ref=e19]
        - paragraph [ref=e20]: When you create an account, we collect your email address and password. You may optionally provide additional profile information including a username, biography, and profile picture (avatar). Your username, biography, and avatar are publicly visible once set.
        - heading "1.2 Content You Upload" [level=3] [ref=e21]
        - paragraph [ref=e22]: When you use the Service to analyze content, we collect and store the media you upload, including video files, image files, and text submissions. This content is stored in our cloud infrastructure and is used solely to perform the analysis you request.
        - heading "1.3 Analysis Results" [level=3] [ref=e23]
        - paragraph [ref=e24]: When we process your content through our AI analysis pipeline, the resulting neural activation scores, segment data, brain region activations, and associated metadata are stored in our database and linked to your account.
        - heading "1.4 Payment Information" [level=3] [ref=e25]
        - paragraph [ref=e26]:
          - strong [ref=e27]: Paid plans are paused during the research beta. The Stripe integration is retained for future use but is not currently collecting any payments.
        - paragraph [ref=e28]:
          - text: If you subscribe to a paid plan once paid tiers resume, your payment is processed by our third-party payment processor, Stripe, Inc. We transmit your email address to Stripe to create a customer record. We do not receive, store, or process your credit card number, CVV, or full billing details. Stripe's collection and use of your payment information is governed by the
          - link "Stripe Privacy Policy" [ref=e29] [cursor=pointer]:
            - /url: https://stripe.com/privacy
          - text: .
        - heading "1.5 Usage Data" [level=3] [ref=e30]
        - paragraph [ref=e31]: We track credit consumption for free-tier users to enforce daily usage limits. This includes records of when analyses were initiated and which job they correspond to. We also store subscription status information (active, canceled, etc.) synced from Stripe via webhooks.
        - paragraph [ref=e32]:
          - text: To prevent abuse, we apply rate limits on content-submission endpoints using
          - strong [ref=e33]: Upstash
          - text: ", a managed Redis service. Upstash stores a short-lived record of your user identifier and request timestamp solely to enforce per-user request limits. These records expire automatically and are not used for any other purpose."
        - paragraph [ref=e34]:
          - text: When an analysis you submitted completes or fails, we send you a transactional email (for example, "Your analysis is ready") via
          - strong [ref=e35]: Resend
          - text: ", our email delivery provider. To send these emails, we share your email address, the analysis filename, and a link to the result page with Resend. We do not use Resend for marketing emails, and we do not send promotional communications without your separate consent."
        - heading "1.6 Automatically Collected Information" [level=3] [ref=e36]
        - paragraph [ref=e37]: We use essential authentication cookies provided by Supabase to maintain your login session. These are strictly functional cookies required for the Service to operate.
        - paragraph [ref=e38]:
          - text: We use
          - strong [ref=e39]: Vercel Analytics
          - text: ", a first-party, privacy-friendly analytics service provided by our hosting provider Vercel, Inc., to measure aggregate traffic and performance. Vercel Analytics:"
        - list [ref=e40]:
          - listitem [ref=e41]:
            - text: Does
            - strong [ref=e42]: not
            - text: set cookies or use browser local storage for tracking.
          - listitem [ref=e43]:
            - text: Does
            - strong [ref=e44]: not
            - text: collect personally identifiable information.
          - listitem [ref=e45]:
            - text: Does
            - strong [ref=e46]: not
            - text: track you across other websites.
          - listitem [ref=e47]: Collects aggregated page view counts, referrer information, device/browser type, and approximate country-level location derived from IP address. IP addresses are hashed and not stored.
        - paragraph [ref=e48]: Because Vercel Analytics is cookieless and does not collect personal data, it operates without requiring your consent. You may still opt out by enabling "Do Not Track" in your browser, which Vercel Analytics honors.
        - paragraph [ref=e49]:
          - text: If you consent to analytics cookies, we use
          - strong [ref=e50]: PostHog
          - text: ", a product analytics platform, to collect usage data including:"
        - list [ref=e51]:
          - listitem [ref=e52]: Pages viewed and navigation patterns
          - listitem [ref=e53]: Feature usage and interaction events (clicks, form submissions, feature usage, subscription events)
          - listitem [ref=e54]: Device type, browser type, and operating system
          - listitem [ref=e55]: Approximate location derived from IP address (country/region level only)
          - listitem [ref=e56]: Session duration and frequency
          - listitem [ref=e57]: A persistent identifier linking events to your account after you log in
        - paragraph [ref=e58]: PostHog data is collected only after you provide consent via our cookie banner. You may decline analytics cookies, and the Service will function normally without them. You may withdraw your consent at any time by clearing your browser's local storage for this site, which will cause the banner to reappear.
        - paragraph [ref=e59]:
          - strong [ref=e60]: "We do not use:"
        - list [ref=e61]:
          - listitem [ref=e62]: Advertising cookies or pixels
          - listitem [ref=e63]: Third-party advertising networks (e.g., Meta Pixel, Google Ads)
          - listitem [ref=e64]: Device fingerprinting
          - listitem [ref=e65]: Cross-site tracking
        - heading "2. How We Use Your Information" [level=2] [ref=e66]
        - paragraph [ref=e67]: "We use the information we collect to:"
        - list [ref=e68]:
          - listitem [ref=e69]: Provide, maintain, and improve the Service, including processing your content through our AI analysis pipeline
          - listitem [ref=e70]: Process payments and manage your subscription
          - listitem [ref=e71]: Track and enforce credit usage limits for free-tier accounts
          - listitem [ref=e72]: Display your public profile and public analyses on the Discover page and your profile page (only when you choose to make content public)
          - listitem [ref=e73]: Communicate with you about service-related matters, including account verification, billing, and policy changes
          - listitem [ref=e74]: Detect, investigate, and prevent fraudulent transactions, unauthorized access, and other illegal activities
          - listitem [ref=e75]: Comply with legal obligations
        - heading "3. How We Process Your Content" [level=2] [ref=e76]
        - paragraph [ref=e77]: "When you submit content for analysis, the following processing occurs:"
        - list [ref=e78]:
          - listitem [ref=e79]: Your uploaded media is stored securely in our cloud storage infrastructure (hosted by Supabase).
          - listitem [ref=e80]: A URL referencing your uploaded content is transmitted to RunPod, a third-party GPU compute provider, where Meta's TRIBE v2 brain-predictive foundation model processes the content and generates neural activation predictions.
          - listitem [ref=e81]: The resulting analysis data (scores, segments, brain region activations) is returned to our servers and stored in our database.
        - paragraph [ref=e82]:
          - strong [ref=e83]: "Important:"
        - list [ref=e84]:
          - listitem [ref=e85]:
            - text: We do
            - strong [ref=e86]: not
            - text: use your content to train, fine-tune, or improve any AI or machine learning models.
          - listitem [ref=e87]:
            - text: We do
            - strong [ref=e88]: not
            - text: sell, license, or otherwise distribute your raw content to third parties for marketing or advertising.
          - listitem [ref=e89]:
            - text: Your raw content is processed solely to deliver the analysis you requested and to support the non-commercial research dataset described in our
            - link "Contribution Agreement" [ref=e90] [cursor=pointer]:
              - /url: /research-agreement
            - text: .
          - listitem [ref=e91]:
            - text: During the research beta, the derived
            - emphasis [ref=e92]: mathematical neural-activation predictions
            - text: (not the raw media you uploaded) may be aggregated and shared with the AI research community in accordance with the Contribution Agreement.
