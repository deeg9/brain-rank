        - paragraph [ref=e152]: We do not share your personal information with any other third parties for marketing, advertising, or data brokering purposes.
        - heading "5. Public Content & Social Features" [level=2] [ref=e153]
        - list [ref=e154]:
          - listitem [ref=e155]:
            - strong [ref=e156]: Private by default.
            - text: All analyses are private when created. You must explicitly choose to make an analysis public.
          - listitem [ref=e157]:
            - strong [ref=e158]: Public analyses
            - text: are visible on the Discover page and your public profile page. Other authenticated users may view and bookmark your public analyses.
          - listitem [ref=e159]:
            - strong [ref=e160]: Public profiles
            - text: display your username, avatar, biography, and any analyses you have made public.
          - listitem [ref=e161]:
            - strong [ref=e162]: View counts
            - text: on public analyses are tracked anonymously. We do not record the identity of individual viewers.
          - listitem [ref=e163]: You may change an analysis from public to private (or vice versa) at any time.
        - heading "6. Cookies & Tracking Technologies" [level=2] [ref=e164]
        - paragraph [ref=e165]: "BrainRank uses the following categories of cookies:"
        - heading "Essential Cookies (Always Active)" [level=3] [ref=e166]
        - paragraph [ref=e167]: Authentication session cookies provided by Supabase are strictly necessary for the Service to function. These cookies maintain your login session and cannot be opted out of while using the Service. They do not track your behavior or collect analytics data.
        - heading "First-Party Analytics (No Cookies)" [level=3] [ref=e168]
        - paragraph [ref=e169]: We use Vercel Analytics, which measures aggregate traffic without setting cookies, without using browser local storage for tracking, and without collecting personally identifiable information. Because it does not rely on cookies or personal data, it does not require consent. You may opt out by enabling your browser's "Do Not Track" setting.
        - heading "Analytics Cookies (Consent Required)" [level=3] [ref=e170]
        - paragraph [ref=e171]: With your consent, we use PostHog to set analytics cookies (and local storage entries) that help us understand how you use the Service. These track page views, feature interactions, and session data, and are tied to your account identifier once you log in. Analytics cookies are only set after you click "Accept" on our cookie consent banner.
        - paragraph [ref=e172]: "You can manage your cookie preferences at any time:"
        - list [ref=e173]:
          - listitem [ref=e174]:
            - strong [ref=e175]: "On first visit:"
            - text: A cookie consent banner will appear at the bottom of the page. You may accept or decline analytics cookies.
          - listitem [ref=e176]:
            - strong [ref=e177]: "To change your choice:"
            - text: Clear your browser's local storage for this site, and the consent banner will reappear on your next visit.
          - listitem [ref=e178]:
            - strong [ref=e179]: "Browser settings:"
            - text: You can block all cookies through your browser settings, though this may affect the functionality of the Service.
        - paragraph [ref=e180]: We do not use advertising cookies, retargeting pixels, or cross-site tracking technologies.
        - heading "7. Data Retention" [level=2] [ref=e181]
        - list [ref=e182]:
          - listitem [ref=e183]:
            - strong [ref=e184]: Account data
            - text: is retained for as long as your account is active.
          - listitem [ref=e185]:
            - strong [ref=e186]: Uploaded content and analysis results
            - text: are retained until you delete them or delete your account.
          - listitem [ref=e187]:
            - strong [ref=e188]: Credit usage records
            - text: are retained for billing audit and compliance purposes.
          - listitem [ref=e189]:
            - strong [ref=e190]: Payment and subscription records
            - text: synced from Stripe are retained for financial reconciliation and legal compliance.
          - listitem [ref=e191]:
            - strong [ref=e192]: "Account deletion:"
            - text: You may request deletion of your account and associated data by contacting us. Upon account deletion, we will remove your personal data from our active systems, subject to any legal retention requirements.
        - heading "8. Data Security" [level=2] [ref=e193]
        - paragraph [ref=e194]: "We implement reasonable technical and organizational measures to protect your personal information, including:"
        - list [ref=e195]:
          - listitem [ref=e196]: All data transmitted between your browser and our servers is encrypted via HTTPS/TLS.
          - listitem [ref=e197]: Database access is controlled through row-level security policies, ensuring users can only access their own data.
          - listitem [ref=e198]: Sensitive API keys and service credentials are stored server-side and never exposed to client applications.
          - listitem [ref=e199]: Payment processing is handled entirely by Stripe, a PCI DSS Level 1 certified provider.
        - paragraph [ref=e200]: While we strive to protect your personal information, no method of transmission over the Internet or method of electronic storage is 100% secure. We cannot guarantee absolute security. You use the Service at your own risk.
        - heading "9. Children's Privacy" [level=2] [ref=e201]
        - paragraph [ref=e202]: The Service is not intended for use by individuals under the age of 13. We do not knowingly collect personal information from children under 13. If we become aware that we have collected personal information from a child under 13, we will take steps to delete such information promptly. If you believe that a child under 13 has provided us with personal information, please contact us at the address below.
        - heading "10. Your Rights" [level=2] [ref=e203]
        - paragraph [ref=e204]: "Depending on your location, you may have the following rights regarding your personal information:"
        - heading "All Users" [level=3] [ref=e205]
        - list [ref=e206]:
          - listitem [ref=e207]: Access, correct, or update your account information through your Settings page.
          - listitem [ref=e208]: Delete individual analyses and their associated uploaded content.
          - listitem [ref=e209]: Toggle any analysis between public and private.
          - listitem [ref=e210]: Cancel your subscription at any time through the Billing settings.
          - listitem [ref=e211]: Request deletion of your account by contacting us.
        - heading "California Residents (CCPA/CPRA)" [level=3] [ref=e212]
        - paragraph [ref=e213]: "If you are a California resident, you have the right to:"
        - list [ref=e214]:
          - listitem [ref=e215]: Request disclosure of the categories and specific pieces of personal information we have collected about you.
          - listitem [ref=e216]: Request deletion of your personal information.
          - listitem [ref=e217]:
            - text: Opt out of the sale or sharing of your personal information.
            - strong [ref=e218]: We do not sell or share your personal information.
          - listitem [ref=e219]: Not be discriminated against for exercising your privacy rights.
        - heading "European Economic Area, United Kingdom & Switzerland (GDPR)" [level=3] [ref=e220]
        - paragraph [ref=e221]: "If you are located in the EEA, UK, or Switzerland, you have the right to:"
        - list [ref=e222]:
          - listitem [ref=e223]: Access, rectify, or erase your personal data.
          - listitem [ref=e224]: Restrict or object to processing of your personal data.
          - listitem [ref=e225]: Data portability (receive your data in a structured, machine-readable format).
          - listitem [ref=e226]: Withdraw consent at any time where processing is based on consent.
          - listitem [ref=e227]: Lodge a complaint with your local Data Protection Authority.
        - paragraph [ref=e228]: "Our legal bases for processing your personal data include: performance of a contract (providing the Service), legitimate interests (improving and securing the Service), compliance with legal obligations, and your consent where applicable."
        - heading "11. International Data Transfers" [level=2] [ref=e229]
        - paragraph [ref=e230]: Your information may be transferred to, stored, and processed in the United States and other countries where our service providers operate. These countries may have data protection laws that differ from the laws of your country. By using the Service, you consent to the transfer of your information to the United States and other jurisdictions. We take reasonable steps to ensure that your data is treated securely and in accordance with this Privacy Policy.
        - heading "12. Changes to This Privacy Policy" [level=2] [ref=e231]
        - paragraph [ref=e232]: We may update this Privacy Policy from time to time. If we make material changes, we will notify you by posting the updated policy on this page with a revised "Last Updated" date. Your continued use of the Service after any changes constitutes your acceptance of the updated policy. We encourage you to review this policy periodically.
        - heading "13. Contact Us" [level=2] [ref=e233]
        - paragraph [ref=e234]: "If you have any questions, concerns, or requests regarding this Privacy Policy or our data practices, please contact us at:"
        - paragraph [ref=e235]:
          - strong [ref=e236]: "Email:"
          - text: privacy@brainrank.app
