        - heading "Privacy Policy" [level=1] [ref=e9]
        - paragraph [ref=e10]: "Effective Date: April 15, 2026"
        - paragraph [ref=e11]: "Last Updated: April 15, 2026"
        - paragraph [ref=e12]: This Privacy Policy describes how BrainRank ("we," "us," or "our") collects, uses, discloses, and protects your personal information when you access or use our website, applications, and related services (collectively, the "Service"). By using the Service, you agree to the collection and use of information in accordance with this policy.
        - heading "1. Information We Collect" [level=2] [ref=e13]
        - heading "1.1 Account Information" [level=3] [ref=e14]
        - paragraph [ref=e15]: When you create an account, we collect your email address and password. You may optionally provide additional profile information including a username, biography, and profile picture (avatar). Your username, biography, and avatar are publicly visible once set.
        - heading "1.2 Content You Upload" [level=3] [ref=e16]
        - paragraph [ref=e17]: When you use the Service to analyze content, we collect and store the media you upload, including video files, image files, and text submissions. This content is stored in our cloud infrastructure and is used solely to perform the analysis you request.
        - heading "1.3 Analysis Results" [level=3] [ref=e18]
        - paragraph [ref=e19]: When we process your content through our AI analysis pipeline, the resulting neural activation scores, segment data, brain region activations, and associated metadata are stored in our database and linked to your account.
        - heading "1.4 Payment Information" [level=3] [ref=e20]
        - paragraph [ref=e21]:
          - text: If you subscribe to a paid plan, your payment is processed by our third-party payment processor, Stripe, Inc. We transmit your email address to Stripe to create a customer record. We do not receive, store, or process your credit card number, CVV, or full billing details. Stripe's collection and use of your payment information is governed by the
          - link "Stripe Privacy Policy" [ref=e22] [cursor=pointer]:
            - /url: https://stripe.com/privacy
          - text: .
        - heading "1.5 Usage Data" [level=3] [ref=e23]
        - paragraph [ref=e24]: We track credit consumption for free-tier users to enforce weekly usage limits. This includes records of when analyses were initiated and which job they correspond to. We also store subscription status information (active, canceled, etc.) synced from Stripe via webhooks.
        - heading "1.6 Automatically Collected Information" [level=3] [ref=e25]
        - paragraph [ref=e26]: We use essential authentication cookies provided by Supabase to maintain your login session. These are strictly functional cookies required for the Service to operate.
        - paragraph [ref=e27]:
          - strong [ref=e28]: "We do not use:"
        - list [ref=e29]:
          - listitem [ref=e30]: Analytics or tracking cookies
          - listitem [ref=e31]: Advertising cookies or pixels
          - listitem [ref=e32]: Third-party tracking scripts (e.g., Google Analytics, Meta Pixel, Segment)
          - listitem [ref=e33]: Device fingerprinting
          - listitem [ref=e34]: IP address logging for tracking purposes
          - listitem [ref=e35]: Geolocation tracking
        - heading "2. How We Use Your Information" [level=2] [ref=e36]
        - paragraph [ref=e37]: "We use the information we collect to:"
        - list [ref=e38]:
          - listitem [ref=e39]: Provide, maintain, and improve the Service, including processing your content through our AI analysis pipeline
          - listitem [ref=e40]: Process payments and manage your subscription
          - listitem [ref=e41]: Track and enforce credit usage limits for free-tier accounts
          - listitem [ref=e42]: Display your public profile and public analyses on the Discover page and your profile page (only when you choose to make content public)
          - listitem [ref=e43]: Communicate with you about service-related matters, including account verification, billing, and policy changes
          - listitem [ref=e44]: Detect, investigate, and prevent fraudulent transactions, unauthorized access, and other illegal activities
          - listitem [ref=e45]: Comply with legal obligations
        - heading "3. How We Process Your Content" [level=2] [ref=e46]
        - paragraph [ref=e47]: "When you submit content for analysis, the following processing occurs:"
        - list [ref=e48]:
          - listitem [ref=e49]: Your uploaded media is stored securely in our cloud storage infrastructure (hosted by Supabase).
          - listitem [ref=e50]: A URL referencing your uploaded content is transmitted to RunPod, a third-party GPU compute provider, where Meta's TRIBE v2 brain-predictive foundation model processes the content and generates neural activation predictions.
          - listitem [ref=e51]: The resulting analysis data (scores, segments, brain region activations) is returned to our servers and stored in our database.
        - paragraph [ref=e52]:
          - strong [ref=e53]: "Important:"
        - list [ref=e54]:
          - listitem [ref=e55]:
            - text: We do
            - strong [ref=e56]: not
            - text: use your content to train, fine-tune, or improve any AI or machine learning models.
          - listitem [ref=e57]:
            - text: We do
            - strong [ref=e58]: not
            - text: sell, license, or otherwise distribute your content to third parties.
          - listitem [ref=e59]: Your content is processed solely to deliver the analysis you requested.
        - heading "4. Third-Party Service Providers" [level=2] [ref=e60]
        - paragraph [ref=e61]: "We engage the following third-party service providers to operate the Service. Each provider's use of your data is governed by their own privacy policy:"
        - table [ref=e62]:
          - rowgroup [ref=e63]:
