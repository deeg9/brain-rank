                  - /url: https://www.runpod.io/legal/privacy-policy
        - paragraph [ref=e91]: We do not share your personal information with any other third parties for marketing, advertising, or data brokering purposes.
        - heading "5. Public Content & Social Features" [level=2] [ref=e92]
        - list [ref=e93]:
          - listitem [ref=e94]:
            - strong [ref=e95]: Private by default.
            - text: All analyses are private when created. You must explicitly choose to make an analysis public.
          - listitem [ref=e96]:
            - strong [ref=e97]: Public analyses
            - text: are visible on the Discover page and your public profile page. Other authenticated users may view and bookmark your public analyses.
          - listitem [ref=e98]:
            - strong [ref=e99]: Public profiles
            - text: display your username, avatar, biography, and any analyses you have made public.
          - listitem [ref=e100]:
            - strong [ref=e101]: View counts
            - text: on public analyses are tracked anonymously. We do not record the identity of individual viewers.
          - listitem [ref=e102]: You may change an analysis from public to private (or vice versa) at any time.
        - heading "6. Cookies & Tracking Technologies" [level=2] [ref=e103]
        - paragraph [ref=e104]:
          - text: BrainRank uses only
          - strong [ref=e105]: essential, first-party authentication cookies
          - text: provided by Supabase to maintain your login session. These cookies are strictly necessary for the Service to function and cannot be opted out of while using the Service.
        - paragraph [ref=e106]: We do not deploy any analytics, advertising, or third-party tracking cookies. We do not use web beacons, pixel tags, or similar tracking technologies. Because we use only essential functional cookies, no cookie consent banner is required.
        - heading "7. Data Retention" [level=2] [ref=e107]
        - list [ref=e108]:
          - listitem [ref=e109]:
            - strong [ref=e110]: Account data
            - text: is retained for as long as your account is active.
          - listitem [ref=e111]:
            - strong [ref=e112]: Uploaded content and analysis results
            - text: are retained until you delete them or delete your account.
          - listitem [ref=e113]:
            - strong [ref=e114]: Credit usage records
            - text: are retained for billing audit and compliance purposes.
          - listitem [ref=e115]:
            - strong [ref=e116]: Payment and subscription records
            - text: synced from Stripe are retained for financial reconciliation and legal compliance.
          - listitem [ref=e117]:
            - strong [ref=e118]: "Account deletion:"
            - text: You may request deletion of your account and associated data by contacting us. Upon account deletion, we will remove your personal data from our active systems, subject to any legal retention requirements.
        - heading "8. Data Security" [level=2] [ref=e119]
        - paragraph [ref=e120]: "We implement reasonable technical and organizational measures to protect your personal information, including:"
        - list [ref=e121]:
          - listitem [ref=e122]: All data transmitted between your browser and our servers is encrypted via HTTPS/TLS.
          - listitem [ref=e123]: Database access is controlled through row-level security policies, ensuring users can only access their own data.
          - listitem [ref=e124]: Sensitive API keys and service credentials are stored server-side and never exposed to client applications.
          - listitem [ref=e125]: Payment processing is handled entirely by Stripe, a PCI DSS Level 1 certified provider.
        - paragraph [ref=e126]: While we strive to protect your personal information, no method of transmission over the Internet or method of electronic storage is 100% secure. We cannot guarantee absolute security. You use the Service at your own risk.
        - heading "9. Children's Privacy" [level=2] [ref=e127]
        - paragraph [ref=e128]: The Service is not intended for use by individuals under the age of 13. We do not knowingly collect personal information from children under 13. If we become aware that we have collected personal information from a child under 13, we will take steps to delete such information promptly. If you believe that a child under 13 has provided us with personal information, please contact us at the address below.
        - heading "10. Your Rights" [level=2] [ref=e129]
        - paragraph [ref=e130]: "Depending on your location, you may have the following rights regarding your personal information:"
        - heading "All Users" [level=3] [ref=e131]
        - list [ref=e132]:
          - listitem [ref=e133]: Access, correct, or update your account information through your Settings page.
          - listitem [ref=e134]: Delete individual analyses and their associated uploaded content.
          - listitem [ref=e135]: Toggle any analysis between public and private.
          - listitem [ref=e136]: Cancel your subscription at any time through the Billing settings.
          - listitem [ref=e137]: Request deletion of your account by contacting us.
        - heading "California Residents (CCPA/CPRA)" [level=3] [ref=e138]
        - paragraph [ref=e139]: "If you are a California resident, you have the right to:"
        - list [ref=e140]:
          - listitem [ref=e141]: Request disclosure of the categories and specific pieces of personal information we have collected about you.
          - listitem [ref=e142]: Request deletion of your personal information.
          - listitem [ref=e143]:
            - text: Opt out of the sale or sharing of your personal information.
            - strong [ref=e144]: We do not sell or share your personal information.
          - listitem [ref=e145]: Not be discriminated against for exercising your privacy rights.
        - heading "European Economic Area, United Kingdom & Switzerland (GDPR)" [level=3] [ref=e146]
        - paragraph [ref=e147]: "If you are located in the EEA, UK, or Switzerland, you have the right to:"
        - list [ref=e148]:
          - listitem [ref=e149]: Access, rectify, or erase your personal data.
          - listitem [ref=e150]: Restrict or object to processing of your personal data.
          - listitem [ref=e151]: Data portability (receive your data in a structured, machine-readable format).
          - listitem [ref=e152]: Withdraw consent at any time where processing is based on consent.
          - listitem [ref=e153]: Lodge a complaint with your local Data Protection Authority.
        - paragraph [ref=e154]: "Our legal bases for processing your personal data include: performance of a contract (providing the Service), legitimate interests (improving and securing the Service), compliance with legal obligations, and your consent where applicable."
        - heading "11. International Data Transfers" [level=2] [ref=e155]
        - paragraph [ref=e156]: Your information may be transferred to, stored, and processed in the United States and other countries where our service providers operate. These countries may have data protection laws that differ from the laws of your country. By using the Service, you consent to the transfer of your information to the United States and other jurisdictions. We take reasonable steps to ensure that your data is treated securely and in accordance with this Privacy Policy.
        - heading "12. Changes to This Privacy Policy" [level=2] [ref=e157]
        - paragraph [ref=e158]: We may update this Privacy Policy from time to time. If we make material changes, we will notify you by posting the updated policy on this page with a revised "Last Updated" date. Your continued use of the Service after any changes constitutes your acceptance of the updated policy. We encourage you to review this policy periodically.
        - heading "13. Contact Us" [level=2] [ref=e159]
        - paragraph [ref=e160]: "If you have any questions, concerns, or requests regarding this Privacy Policy or our data practices, please contact us at:"
        - paragraph [ref=e161]:
          - strong [ref=e162]: "Email:"
          - text: privacy@brainrank.app
