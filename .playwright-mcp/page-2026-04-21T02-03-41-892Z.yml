            - text: BrainRank runs uploaded videos, images, and scripts through Meta's
            - link "TRIBE v2" [ref=e18] [cursor=pointer]:
              - /url: https://ai.meta.com/blog/tribe-v2-brain-predictive-foundation-model/
            - text: — a brain-predictive foundation model released in March 2026 — and returns a predicted neural activation profile across nine functional brain networks. Predictions are computational estimates, not medical data, and represent what a representative pool of viewers' brains would be expected to do if they watched your content under naturalistic conditions.
        - generic [ref=e19]:
          - heading "Why it exists" [level=2] [ref=e20]
          - paragraph [ref=e21]: "Meta released TRIBE v2 under the Creative Commons BY-NC 4.0 license — non-commercial use only — with the explicit goal of advancing in-silico neuroscience. We built BrainRank to put the model into the hands of the people whose work the neuroscience is about: storytellers. Every upload contributes a content-to-neural-response datapoint to a growing open research dataset that we intend to share with the broader AI and neuroscience community."
          - paragraph [ref=e22]: We do not charge for analysis, we do not sell user data, and the service is operated strictly within the terms of the TRIBE v2 license.
