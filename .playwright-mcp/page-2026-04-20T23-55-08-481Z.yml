        - heading "2. Description of Service" [level=2] [ref=e20]
        - paragraph [ref=e21]:
          - text: BrainRank is an AI-powered content analysis platform that uses brain-predictive modeling to generate neural activation scores for user-submitted content. The Service processes uploaded videos, images, and text through Meta's TRIBE v2 foundation model and returns per-segment predictions of neural engagement. These predictions are computational estimates derived from machine learning models trained on functional magnetic resonance imaging (fMRI) data. They are
          - strong [ref=e22]: not
          - text: actual brain scans, medical measurements, or recordings of real viewer brain activity.
        - heading "3. Eligibility" [level=2] [ref=e23]
