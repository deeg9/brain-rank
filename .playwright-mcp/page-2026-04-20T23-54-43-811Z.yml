        - heading "TRIBE v2 Community Research Agreement" [level=1] [ref=e9]
        - paragraph [ref=e10]: "Effective Date: April 20, 2026"
        - paragraph [ref=e11]: "Last Updated: April 20, 2026"
        - paragraph [ref=e12]: This Contribution Agreement ("Agreement") governs your voluntary contribution of media to the Open Storytelling Research Project operated by BrainRank ("we," "us," or "our"). By checking the consent box before uploading media to BrainRank, you agree to the terms set out below. If you do not agree, do not upload content.
        - heading "1. Purpose of Data Collection" [level=2] [ref=e13]
        - paragraph [ref=e14]: By uploading media to BrainRank, you agree to participate in an open research initiative. We use Meta's TRIBE v2 model (licensed under Creative Commons Attribution-NonCommercial 4.0) to analyze how the human brain might perceive your content. Our goal is to build a public dataset that helps the AI research community develop better, more engaging storytelling and video-generation models.
        - heading "2. What We Collect" [level=2] [ref=e15]
        - list [ref=e16]:
          - listitem [ref=e17]: The video, image, or text files you upload.
          - listitem [ref=e18]: The "Brain Map" predictions generated by TRIBE v2 for each submission.
          - listitem [ref=e19]: Anonymous analytics on which parts of the media triggered the strongest predicted neural responses.
        - paragraph [ref=e20]:
          - text: For a complete description of all data we collect about you and your account, see our
          - link "Privacy Policy" [ref=e21] [cursor=pointer]:
            - /url: /privacy
          - text: .
        - heading "3. Grant of License" [level=2] [ref=e22]
        - paragraph [ref=e23]: "You retain all ownership of your original content. By uploading, you grant BrainRank a non-exclusive, royalty-free, worldwide license to use, host, store, and analyze your media for non-commercial research purposes only. This license permits us to:"
        - list [ref=e24]:
          - listitem [ref=e25]: Process your media through the TRIBE v2 model to generate neural activation predictions.
          - listitem [ref=e26]: Retain the media and the resulting predictions as part of the research dataset.
          - listitem [ref=e27]: Publish and share aggregated, derived, or anonymized research outputs (such as predicted neural activation statistics) with the broader AI research community.
        - paragraph [ref=e28]: This license terminates with respect to new uses when you delete your content or your account. We may retain previously generated aggregate statistics, as these cannot reasonably be tied back to individual uploads.
        - heading "4. Open Science Commitment" [level=2] [ref=e29]
        - paragraph [ref=e30]:
          - text: In the spirit of open research, we commit to sharing aggregated insights and neuro-ranking data with the broader AI community to advance the field of in-silico neuroscience and creative AI. We do
          - strong [ref=e31]: not
          - text: sell your personal data, and we do not use your raw media for advertising or commercial training purposes.
        - heading "5. Non-Commercial Usage" [level=2] [ref=e32]
        - paragraph [ref=e33]:
          - text: This service is provided free of charge. No fees are collected for the analysis, and the underlying TRIBE v2 model is used strictly in accordance with Meta's
          - link "Creative Commons Attribution-NonCommercial 4.0" [ref=e34] [cursor=pointer]:
            - /url: https://creativecommons.org/licenses/by-nc/4.0/
          - text: license. Required attribution for the TRIBE v2 model is provided in our site footer and on the
          - link "TRIBE v2 GitHub repository" [ref=e35] [cursor=pointer]:
            - /url: https://github.com/facebookresearch/tribev2
          - text: .
        - heading "6. Your Responsibilities" [level=2] [ref=e36]
        - paragraph [ref=e37]: "You represent and warrant that:"
        - list [ref=e38]:
          - listitem [ref=e39]: You own or have the necessary rights and permissions to upload and authorize the non-commercial research use of the content you submit.
          - listitem [ref=e40]: Your uploads do not contain content belonging to third parties whose rights would be infringed by this Agreement.
          - listitem [ref=e41]: You are not uploading personal health information, government-issued identification, or other sensitive personal data that you do not have the right to share.
        - paragraph [ref=e42]: If you upload personal videos (for example, family clips), we will not sell your personal data. We will use only the mathematical predictions derived from your content for research dataset purposes.
        - heading "7. Withdrawing Your Contribution" [level=2] [ref=e43]
        - paragraph [ref=e44]: You may delete individual analyses and their associated uploaded media at any time from your Dashboard. Deletion removes the item from our active research dataset for any subsequent releases. To request full deletion of your account and associated data, contact us at the address below.
        - heading "8. Changes to This Agreement" [level=2] [ref=e45]
        - paragraph [ref=e46]: We may update this Agreement from time to time. If we make material changes, we will post the updated Agreement on this page with a revised "Last Updated" date and require new consent on your next upload.
        - heading "9. Relationship to Other Terms" [level=2] [ref=e47]
        - paragraph [ref=e48]:
          - text: This Agreement is incorporated into, and supplements, our
          - link "Terms and Conditions" [ref=e49] [cursor=pointer]:
            - /url: /terms
          - text: and
          - link "Privacy Policy" [ref=e50] [cursor=pointer]:
            - /url: /privacy
          - text: . In the event of a conflict between this Agreement and our Terms and Conditions as they relate specifically to uploaded media and research use, this Agreement controls.
        - heading "10. Contact" [level=2] [ref=e51]
        - paragraph [ref=e52]: "Questions about this Agreement or the Open Storytelling Research Project can be sent to:"
        - paragraph [ref=e53]:
