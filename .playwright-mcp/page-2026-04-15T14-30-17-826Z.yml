          - listitem [ref=e42]: Scores and metrics may vary based on content format, duration, resolution, language, and other factors.
          - listitem [ref=e43]: The AI model has known limitations, including a context window of approximately 100 seconds for video content. Content exceeding this duration is analyzed in segments, which may affect overall scores.
          - listitem [ref=e44]: Model performance may differ significantly across content types (video, image, text), genres, languages, and cultural contexts.
          - listitem [ref=e45]: Results generated today may differ from results generated for the same content at a later date due to model updates, infrastructure changes, or other technical factors.
