        - heading "2. AI Predictions Are Computational Estimates" [level=2] [ref=e26]
        - paragraph [ref=e27]: "BrainRank uses Meta's TRIBE v2 (Brain-Predictive Foundation Model) to generate neural activation predictions for user-submitted content. It is important that you understand the nature and limitations of these predictions:"
        - list [ref=e28]:
          - listitem [ref=e29]:
            - strong [ref=e30]: Computational estimates, not brain scans.
            - text: The scores, heatmaps, and brain region activations displayed by BrainRank are outputs of a machine learning model. They represent statistical predictions of how populations of brain regions might respond to content, based on patterns learned from functional magnetic resonance imaging (fMRI) training data. They are
            - strong [ref=e31]: not
            - text: recordings, scans, or measurements of any individual's brain.
          - listitem [ref=e32]:
            - strong [ref=e33]: Probabilistic, not deterministic.
            - text: AI models are inherently probabilistic. The same content may yield different results under different conditions, and the model's predictions may not correspond to actual viewer responses, engagement, or behavior.
          - listitem [ref=e34]:
            - strong [ref=e35]: Aggregate patterns, not individual predictions.
            - text: The underlying model was trained on aggregate fMRI data from research participants. Predictions reflect population-level statistical patterns, not the neural response of any specific individual viewer.
          - listitem [ref=e36]:
            - strong [ref=e37]: No causal claims.
            - text: Higher neural activation scores do not guarantee higher engagement, views, clicks, conversions, revenue, or any other business outcome. Correlation between predicted neural activation and real-world content performance is not established for your specific use case.
        - heading "3. No Guarantee of Accuracy" [level=2] [ref=e38]
