          - listitem [ref=e54]: Past analysis results do not predict or guarantee future content performance.
        - heading "5. Research Model Limitations" [level=2] [ref=e55]
        - paragraph [ref=e56]:
          - text: The TRIBE v2 model used by BrainRank is a research model developed by Meta AI and released under the
          - strong [ref=e57]: Creative Commons Attribution-NonCommercial 4.0 International License (CC BY-NC-4.0)
          - text: ". You should be aware that:"
        - list [ref=e58]:
          - listitem [ref=e59]: The model was designed for research purposes. Its application to commercial content optimization is an extension of its original intended use.
          - listitem [ref=e60]: The model's training data consisted of fMRI responses from a limited sample of research participants. The training population may not be representative of your target audience in terms of demographics, culture, language, or other characteristics.
          - listitem [ref=e61]: The model has an effective context window of approximately 100 seconds for video content. Short-form content (under 100 seconds) is the model's primary sweet spot; longer content is segmented for analysis.
          - listitem [ref=e62]: As a non-commercial research model, TRIBE v2 has not been independently validated for accuracy in predicting real-world content performance metrics.
